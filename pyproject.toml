[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "virtual-lab"
dynamic = ["version"]
authors = [
    { name = "Kyle Swanson", email = "swansonk.14@gmail.com" },
]
maintainers = [
    { name = "Kyle Swanson", email = "swansonk.14@gmail.com" },
]
description = "A virtual lab of large language model agents for scientific research."
readme = "README.md"
license = { file = "LICENSE" }
# 3.12 is the floor because the prompt builders use backslashes inside f-string
# expressions, which PEP 701 only permits from 3.12 onwards.
requires-python = ">=3.12"
dependencies = [
    # Every model is reached through LangChain, as in Biomni, so that agents can use any provider
    "langchain-anthropic>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    # Renders what the agents write as HTML, for meetings and projects saved as documents
    "markdown-it-py>=3.0",
    "notebook",
    # parse on chat.completions outside beta, and the finish-reason errors carrying the response
    "openai>=1.92",
    # Already required by openai, declared here because meeting output schemas are pydantic models
    "pydantic>=2.4",
    # Reads API keys from a .env file, as Biomni does
    "python-dotenv>=1.0",
    "requests",
    "tiktoken",
    "tqdm",
    "typed-argument-parser",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
keywords = [
    "virtual lab",
    "large language model",
    "LLM",
    "scientific research",
    "automated science",
]

[project.optional-dependencies]
# Local models through Ollama, and models on Amazon Bedrock
ollama = ["langchain-ollama>=1.0"]
bedrock = ["langchain-aws>=1.0"]
# Biomni's benchmarks: pyarrow reads their files, numpy shuffles LAB-Bench's options as Biomni
# does, and pandas gives Biomni's BiomniEval1 its DataFrames
eval = ["numpy", "pandas", "pyarrow"]
# Tools from MCP servers, with connect_mcp, and tools served over MCP, with serve_mcp and
# virtual-lab-mcp. PyYAML reads Biomni's YAML configs
mcp = ["mcp>=2.3,<3", "PyYAML"]
# Meetings and projects saved as PDFs, as Biomni saves its conversations. WeasyPrint also needs
# the Pango library, which pip cannot install
pdf = ["weasyprint>=66"]
# Reading papers saved as PDFs, for the tasks, databases, and software in them
papers = ["pypdf>=5"]
# The web interface, with virtual-lab-ui or launch_ui
ui = ["gradio>=6.0"]
nanobody-design = [
    "biopython",
    "pandas",
    "scipy",
    "seaborn",
    "torch",
    "transformers",
]
dev = [
    "pytest",
    # Every extra the tests use, so that none of them is skipped or fails for want of a package
    "virtual-lab[bedrock,eval,mcp,ollama,papers,pdf,ui]",
]

[project.scripts]
virtual-lab-mcp = "virtual_lab.mcp_server:main"
virtual-lab-papers = "virtual_lab.papers_cli:main"
virtual-lab-ui = "virtual_lab.ui:main"

[tool.hatch.version]
path = "src/virtual_lab/__about__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import their own helpers from conftest, so the tests directory is on sys.path
pythonpath = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[project.urls]
Homepage = "https://github.com/zou-group/virtual-lab"
Issues = "https://github.com/zou-group/virtual-lab/issues"

[tool.ruff]
# Copied unchanged from Biomni, so held to Biomni's own style rather than this project's
extend-exclude = ["src/virtual_lab/sandbox/biomni_package"]
