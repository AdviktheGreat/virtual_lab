[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "virtual-lab"
dynamic = ["version"]
authors = [
    { name = "Kyle Swanson", email = "swansonk.14@gmail.com" },
]
maintainers = [
    { name = "Kyle Swanson", email = "swansonk.14@gmail.com" },
]
description = "A virtual lab of large language model agents for scientific research."
readme = "README.md"
license = { file = "LICENSE" }
# 3.12 is the floor because the prompt builders use backslashes inside f-string
# expressions, which PEP 701 only permits from 3.12 onwards.
requires-python = ">=3.12"
dependencies = [
    "notebook",
    "openai",
    # Already required by openai, declared here because meeting output schemas are pydantic models
    "pydantic>=2.4",
    "requests",
    "tiktoken",
    "tqdm",
    "typed-argument-parser",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
keywords = [
    "virtual lab",
    "large language model",
    "LLM",
    "scientific research",
    "automated science",
]

[project.optional-dependencies]
nanobody-design = [
    "biopython",
    "pandas",
    "scipy",
    "seaborn",
    "torch",
    "transformers",
]
dev = [
    "pytest",
]

[tool.hatch.version]
path = "src/virtual_lab/__about__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import their own helpers from conftest, so the tests directory is on sys.path
pythonpath = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[project.urls]
Homepage = "https://github.com/zou-group/virtual-lab"
Issues = "https://github.com/zou-group/virtual-lab/issues"
